schema_version = "1"

[targets.openai]
adapter = "openai"

[targets.openai.profiles.production]

[targets.openai.profiles.production.agents.PlannerAgent]
model = "gpt-6-sol"
options = { reasoning = { effort = "low" }, verbosity = "low" }

[targets.openai.profiles.production.agents.ResearchManagerAgent]
model = "gpt-6-sol"
options = { reasoning = { effort = "low" }, verbosity = "low" }

[targets.openai.profiles.production.agents.SectionResearchAgent]
model = "gpt-6-sol"
options = { reasoning = { effort = "medium" }, verbosity = "low" }

[targets.openai.profiles.production.agents.EvidenceRepairAgent]
model = "gpt-6-sol"
options = { reasoning = { effort = "low" }, verbosity = "low" }

[targets.openai.profiles.production.agents.TargetedResearchAgent]
model = "gpt-6-sol"
options = { reasoning = { effort = "medium" }, verbosity = "low" }

[targets.openai.profiles.production.agents.VerifierAgent]
model = "gpt-6-sol"
options = { reasoning = { effort = "medium" }, verbosity = "low" }

[targets.openai.profiles.production.agents.SynthesisAgent]
model = "gpt-6-sol"
options = { reasoning = { effort = "low" }, verbosity = "low" }

[targets.openai.tools."research.web_search"]
provider = "openai"
tool = "web_search"
search_context_size = "medium"
